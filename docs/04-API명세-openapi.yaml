          type: object
        handler_count:
          type: integer
        bigman_count:
          type: integer
        warnings:
          items:
            type: string
          type: array
      type: object
      required:
      - attend
      - absent
      - pending
      - position_counts
      - handler_count
      - bigman_count
    AttendanceUpdate:
