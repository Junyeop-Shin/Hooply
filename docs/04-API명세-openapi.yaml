components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Action:
      properties:
        type:
          type: string
          enum:
          - move
          - dribble
          - pass
          - screen
          - cut
          - handoff
          - shot
        slot:
          type: integer
          maximum: 5.0
          minimum: 1.0
        to:
          $ref: '#/components/schemas/Point'
          nullable: true
        target:
          type: integer
          maximum: 5.0
          minimum: 1.0
          nullable: true
      type: object
      required:
      - type
      - slot
    AdminUserRow:
      properties:
        id:
          type: integer
        email:
          type: string
          nullable: true
        name:
          type: string
        nickname:
          type: string
          nullable: true
        global_role:
          type: string
        onboarding_completed:
          type: boolean
        created_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
      type: object
      required:
      - id
      - email
      - name
      - nickname
      - global_role
      - onboarding_completed
      - created_at
      - deleted_at
    AdoptedAssignment:
      properties:
        run_id:
          type: integer
        candidate_id:
          type: integer
        strategy:
          $ref: '#/components/schemas/Strategy'
        squads:
          items:
            $ref: '#/components/schemas/SquadView'
          type: array
        explanation:
          type: string
          nullable: true
        my_squad_no:
          type: integer
          nullable: true
        my_player_id:
          type: integer
          nullable: true
        my_assigned_position:
          type: string
          nullable: true
        adopted_at:
          type: string
          format: date-time
          nullable: true
        skill_spread:
          type: number
          nullable: true
        total_score:
          type: number
          nullable: true
      type: object
      required:
      - run_id
      - candidate_id
      - strategy
      - squads
    AiExplanation:
      properties:
        summary:
          type: string
        key_players:
          items:
            type: string
          type: array
        chemistry:
          items:
            type: string
          type: array
        gaps:
          items:
            type: string
          type: array
        watch_point:
          type: string
        fallback:
          type: boolean
        text:
          type: string
          nullable: true
        cached:
          type: boolean
        fail_reason:
          type: string
          nullable: true
      type: object
      required:
      - summary
      - key_players
      - chemistry
      - gaps
      - watch_point
      - fallback
    AiMessage:
      properties:
        in_assignment:
          type: boolean
        why_position:
          type: string
        role:
          type: string
        partner:
          type: string
        fallback:
          type: boolean
        text:
          type: string
          nullable: true
        cached:
          type: boolean
        fail_reason:
          type: string
          nullable: true
      type: object
      required:
      - fallback
    AiTacticItem:
      properties:
        play_key:
          type: string
        reason:
          type: string
        key_roles:
          items:
            type: string
          type: array
        caution:
          type: string
      type: object
      required:
      - play_key
      - reason
      - key_roles
      - caution
    AiTactics:
      properties:
        squad_no:
          type: integer
        one_liner:
          type: string
        items:
          items:
            $ref: '#/components/schemas/AiTacticItem'
          type: array
        fallback:
          type: boolean
        cached:
          type: boolean
        fail_reason:
          type: string
          nullable: true
      type: object
      required:
      - squad_no
      - one_liner
      - items
      - fallback
    AnswerType:
      type: string
      enum:
      - STEPPER
      - ANCHOR_4
      - MULTI_CHIP
      - ORDINAL_5
      - SINGLE_CHOICE
      - TRIO
    AssignmentRunRequest:
      properties:
        team_count:
          type: integer
          maximum: 4.0
          minimum: 2.0
        strategies:
          items:
            $ref: '#/components/schemas/Strategy'
          type: array
        constraints:
          $ref: '#/components/schemas/ConstraintSet'
      type: object
    AssignmentRunView:
      properties:
