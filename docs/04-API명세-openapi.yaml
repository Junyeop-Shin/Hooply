openapi: 3.0.3
info:
  title: HOOPLY API
  version: 1.0.0
  description: 농구 동호회 팀 매칭 서비스. 인증은 Bearer JWT(access 30분/refresh 14일). 모든 4xx/5xx 본문은 ErrorResponse {code, message, details[]}.
servers:
- url: https://hooply-backend.onrender.com/api/v1
  description: 운영
- url: http://localhost:8000/api/v1
  description: 로컬
security:
- bearerAuth: []
paths:
  /auth/signup:
    post:
      summary: 이메일 회원가입
      tags:
      - 인증 · 프로필
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      security: []
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '409':
          description: EMAIL_DUPLICATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      summary: 이메일 로그인
      tags:
      - 인증 · 프로필
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/kakao/login-url:
    get:
      summary: 카카오 인가 URL 생성
      tags:
      - 인증 · 프로필
      parameters:
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
          nullable: true
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaoLoginUrl'
        '401':
          description: KAKAO_AUTH_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/kakao/callback:
    get:
      summary: 카카오 콜백 (가입/로그인)
      tags:
      - 인증 · 프로필
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: false
        schema:
          type: string
          nullable: true
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaoTokenPair'
        '401':
          description: KAKAO_AUTH_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/kakao/link:
    post:
      summary: 기존 계정에 카카오 연결
      tags:
      - 인증 · 프로필
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoLinkRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '401':
          description: KAKAO_AUTH_FAILED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: IDENTITY_ALREADY_LINKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/refresh:
    post:
      summary: 토큰 갱신
      tags:
      - 인증 · 프로필
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: TOKEN_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      summary: 로그아웃 (refresh 토큰 폐기)
      tags:
      - 인증 · 프로필
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      security: []
      responses:
        '204':
          description: 성공
  /auth/password/forgot:
    post:
      summary: 비밀번호 재설정 요청
      tags:
      - 인증 · 프로필
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      security: []
      responses:
        '202':
          description: 성공
  /auth/password/reset:
    post:
      summary: 비밀번호 재설정
      tags:
      - 인증 · 프로필
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      security: []
      responses:
        '200':
          description: 성공
        '400':
          description: TOKEN_INVALID_OR_EXPIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me:
    get:
      summary: 내 정보 조회
      tags:
      - 인증 · 프로필
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
    delete:
      summary: 계정 삭제
      tags:
      - 인증 · 프로필
      responses:
        '204':
          description: 성공
        '422':
          description: CANNOT_DEMOTE_LAST_MANAGER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: 내 프로필 수정
      tags:
      - 인증 · 프로필
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
  /me/password:
    post:
      summary: 비밀번호 변경
      tags:
      - 인증 · 프로필
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: 성공
        '401':
          description: INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/avatar:
    post:
      summary: 프로필 사진 등록 · 교체
      tags:
      - 인증 · 프로필
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarIn'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: 프로필 사진 삭제
      tags:
      - 인증 · 프로필
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
  /users/{user_id}/avatar:
    get:
      summary: 프로필 사진 이미지
      tags:
      - 인증 · 프로필
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      - name: v
        in: query
        required: false
        schema:
          type: string
          nullable: true
      responses:
        '200':
          description: 성공
        '404':
          description: Not Found
  /me/teams:
    get:
      summary: 내 소속 팀 목록
      tags:
      - 인증 · 프로필
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList_TeamMembershipView_'
  /surveys/onboarding:
    get:
      summary: 온보딩 설문 템플릿 조회
      tags:
      - 온보딩 설문
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyTemplateView'
  /surveys/onboarding/responses:
    post:
      summary: 온보딩 설문 응답 제출
      tags:
      - 온보딩 설문
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SurveyResponseIn'
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
        '400':
          description: VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ALREADY_SUBMITTED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/profile:
    get:
      summary: 내 실력·포지션 프로필
      tags:
      - 온보딩 설문
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
  /me/positions:
    put:
      summary: 가능/선호 포지션 수정
      tags:
      - 온보딩 설문
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PositionsUpdate'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
  /teams/{team_id}/self-rank:
    put:
      summary: 이 동호회에서 내 실력 위치 응답
      tags:
      - 온보딩 설문
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SelfRankIn'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
        '403':
          description: NOT_A_MEMBER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teams:
    post:
      summary: 팀 생성
      tags:
      - 팀 · 참가자
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreate'
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCreated'
  /teams/join:
    post:
      summary: 팀 코드로 가입
      tags:
      - 팀 · 참가자
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamJoinRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetail'
        '404':
          description: TEAM_CODE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ALREADY_MEMBER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teams/{team_id}:
    get:
      summary: 팀 상세 조회
      tags:
      - 팀 · 참가자
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetail'
        '403':
          description: NOT_A_MEMBER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: 팀 정보 수정
      tags:
      - 팀 · 참가자
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdate'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetail'
        '403':
          description: FORBIDDEN_ROLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teams/{team_id}/code:regenerate:
    post:
      summary: 팀 코드 재발급
      tags:
      - 팀 · 참가자
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamCodeView'
        '403':
          description: FORBIDDEN_ROLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teams/{team_id}/players:
    get:
      summary: 팀원 목록 조회
      tags:
      - 팀 · 참가자
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: integer
      - name: kind
        in: query
        required: false
        schema:
          nullable: true
      - name: status
        in: query
        required: false
        schema:
          nullable: true
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - skill
          - name
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList_Union_PlayerCard__PlayerCardDetailed__'
  /teams/{team_id}/players/{player_id}/role:
    patch:
      summary: 매니저 권한 부여/회수
      tags:
      - 팀 · 참가자
      parameters:
      - name: player_id
        in: path
        required: true
        schema:
          type: integer
      - name: team_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerCard'
        '403':
          description: FORBIDDEN_ROLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: CANNOT_DEMOTE_LAST_MANAGER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teams/{team_id}:leave:
    post:
      summary: 팀 나가기
      tags:
      - 팀 · 참가자
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: 성공
        '422':
          description: CANNOT_DEMOTE_LAST_MANAGER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teams/{team_id}/players/{player_id}:
    delete:
      summary: 팀원 제외
      tags:
      - 팀 · 참가자
      parameters:
      - name: player_id
        in: path
        required: true
        schema:
          type: integer
      - name: team_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: 성공
        '403':
          description: FORBIDDEN_ROLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teams/{team_id}/guests:
    post:
      summary: 게스트 레코드 등록
      tags:
      - 게스트 관리
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestCreate'
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerCard'
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSimilar'
    get:
      summary: 기존 게스트 검색
      tags:
      - 게스트 관리
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: integer
      - name: q
        in: query
        required: false
        schema:
          type: string
          nullable: true
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList_PlayerCard_'
  /teams/{team_id}/guests/merge-candidates:
    get:
      summary: 게스트–회원 병합 후보
      tags:
      - 게스트 관리
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList_MergeCandidate_'
        '403':
          description: FORBIDDEN_ROLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /players/{player_id}:
    patch:
      summary: 게스트 정보 수정
      tags:
      - 게스트 관리
      parameters:
      - name: player_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerUpdate'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerCard'
        '403':
          description: FORBIDDEN_NOT_OWNER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /players/{guest_player_id}:merge:
    post:
      summary: 게스트를 회원 계정에 병합
      tags:
      - 게스트 관리
      parameters:
      - name: guest_player_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerCard'
        '403':
          description: FORBIDDEN_ROLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ALREADY_MERGED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: MERGE_KIND_MISMATCH
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /players/{player_id}:unmerge:
    post:
      summary: 게스트 병합 되돌리기
      tags:
      - 게스트 관리
      parameters:
      - name: player_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerCard'
        '403':
          description: FORBIDDEN_ROLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/guest-claims:
    get:
      summary: 내 것일 수 있는 게스트 기록
      tags:
      - 게스트 관리
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList_GuestClaimView_'
  /players/{guest_player_id}:claim:
    post:
      summary: 게스트 기록 본인 확인 (병합 / 거절)
      tags:
      - 게스트 관리
      parameters:
      - name: guest_player_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestClaimIn'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList_GuestClaimView_'
        '403':
          description: FORBIDDEN_ROLE / NOT_A_MEMBER
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: ALREADY_MERGED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /teams/{team_id}/rankings/latest:
    get:
      summary: 현재 활성 정렬 조회
      tags:
      - 매니저 실력 정렬
