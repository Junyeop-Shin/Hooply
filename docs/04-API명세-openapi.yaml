          items:
            $ref: '#/components/schemas/VoteView'
          type: array
        candidates:
          items:
            $ref: '#/components/schemas/VoteCandidate'
          type: array
      type: object
      required:
      - open
      - opens_at
      - already_submitted
      - candidates
    VoteType:
      type: string
      enum:
      - BEST_PERFORMER
      - PLAY_AGAIN
    VoteView:
      properties:
        target_player_id:
          type: integer
        vote_type:
          $ref: '#/components/schemas/VoteType'
        reason_tag:
          $ref: '#/components/schemas/ReasonTag'
          nullable: true
      type: object
      required:
      - target_player_id
      - vote_type
