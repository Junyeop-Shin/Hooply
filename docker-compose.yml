services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hoops
      POSTGRES_PASSWORD: hoops
      POSTGRES_DB: hoops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoops"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://hoops:hoops@db:5432/hoops
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # 프론트엔드: vite build → nginx. /api 는 api 컨테이너로 프록시 (frontend/nginx.conf)
  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
