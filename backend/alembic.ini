# Alembic 설정 파일 (설계서 11.2절 "SQLAlchemy 2.0 + Alembic").
# backend 디렉터리에서 `alembic ...` 명령을 실행하면 이 파일을 읽는다.
# 실제 동작(DB URL 주입, 모델 metadata 등록)은 alembic/env.py에 있으니 그쪽을 먼저 볼 것.

[alembic]
# 마이그레이션 스크립트(env.py, versions/)가 있는 디렉터리. backend 기준 상대 경로.
script_location = alembic
# `.`(backend)를 sys.path 앞에 붙여 env.py에서 `from app...` import가 되게 한다.
prepend_sys_path = .
# 새 리비전 파일 이름 형식: <리비전id>_<slug>.py (예: 0001_initial_schema.py).
# ini 파서의 % 보간을 피하기 위해 %%로 이스케이프되어 있다.
file_template = %%(rev)s_%%(slug)s
# DATABASE_URL은 env.py에서 app 설정으로부터 주입한다
sqlalchemy.url =

# ── 아래는 파이썬 logging 설정 (env.py의 fileConfig가 읽는다) ──────────────────
# 마이그레이션 실행 시 콘솔에 무엇을 얼마나 찍을지 정한다. 스키마와는 무관하다.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

# SQLAlchemy 엔진 로그. 실행되는 DDL을 전부 보고 싶으면 level을 INFO로 올린다.
[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

# Alembic 자체 로그 ("Running upgrade 0001 -> 0002 ..." 같은 진행 메시지).
[logger_alembic]
level = INFO
handlers =
qualname = alembic

# 모든 로그를 stderr로 보낸다.
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
