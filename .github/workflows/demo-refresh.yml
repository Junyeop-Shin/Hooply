# 포트폴리오 데모 데이터 갱신 — 데모 팀(@demo.com 계정, 일요 코트메이트 등)을 지우고 다시 만든다.
# 시드의 일정 날짜가 실행일 기준이라, 그대로 두면 '이번 주 일정' 이 과거가 되어 심사자가 배정해 볼 일정이 사라진다.
# 매주 월요일 00:30(KST) 에 돌아 '이번 주' 가 늘 다가오는 일요일이 되게 하고, 심사자가 바꿔 놓은 것도 원래대로 돌린다.
# 실제 회원 데이터(다른 팀)는 건드리지 않는다 (scripts/remove_demo.py 가 데모 계정·팀만 고른다).
# 필요한 것: 저장소 Secrets 의 BACKUP_DATABASE_URL (백업 워크플로와 같은 값). 끄려면 Variables 에 DEMO_REFRESH_ENABLED=false.
name: Demo data refresh

on:
  schedule:
    - cron: "30 15 * * 0"  # UTC 일요일 15:30 = KST 월요일 00:30
  workflow_dispatch:
    inputs:
      anchor:
        description: "'이번 주' 로 삼을 일요일 (YYYY-MM-DD). 비우면 다가오는 일요일"
        required: false

jobs:
  reseed:
    runs-on: ubuntu-latest
    if: ${{ vars.DEMO_REFRESH_ENABLED != 'false' }}
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET_KEY: not-used-for-seeding
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 데모 데이터 지우고 다시 만들기
        env:
          RAW_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          ANCHOR: ${{ github.event.inputs.anchor }}
        run: |
          if [ -z "$RAW_URL" ]; then echo "BACKUP_DATABASE_URL 시크릿이 없어요"; exit 1; fi
          # 앱은 psycopg 드라이버 접두사를 쓴다
          export DATABASE_URL="$(echo "$RAW_URL" | sed 's#^postgresql://#postgresql+psycopg://#; s#^postgres://#postgresql+psycopg://#')"
          pip install -q -r requirements.txt
          python -m scripts.remove_demo --yes
          python -m scripts.seed_demo --no-admin ${ANCHOR:+--anchor "$ANCHOR"}
